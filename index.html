<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA World Cup 2026 Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚽ FIFA World Cup 2026 Simulator ⚽</h1>
            <p class="subtitle">Based on official December 5, 2025 draw results</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" onclick="showTab('group-stage')">Group Stage</button>
            <button class="tab-button" onclick="showTab('knockout-stage')">Knockout Stage</button>
        </div>

        <!-- Group Stage Tab -->
        <div id="group-stage" class="tab-content active">
            <div class="groups-container" id="groups-container">
                <!-- Groups will be generated by JavaScript -->
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" onclick="generateKnockoutBracket()">Generate Knockout Bracket</button>
            </div>
        </div>

        <!-- Knockout Stage Tab -->
        <div id="knockout-stage" class="tab-content">
            <div class="knockout-info">
                <p>Complete group stage and click 'Generate Knockout Bracket' to begin</p>
            </div>

            <div id="knockout-progress" class="progress-box" style="display: none;">
                <h3>Knockout Stage Progress:</h3>
                <div id="progress-list"></div>
            </div>

            <div id="knockout-container" class="knockout-container">
                <!-- Knockout rounds will be generated by JavaScript -->
            </div>
        </div>

        <div class="bottom-buttons">
            <button class="btn btn-secondary" onclick="saveSimulation()">💾 Save Simulation</button>
            <button class="btn btn-secondary" onclick="loadSimulation()">📂 Load Simulation</button>
            <button class="btn btn-danger" onclick="resetAll()">🔄 Reset All</button>
            <button class="btn btn-info" onclick="showAbout()">ℹ️ About</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
